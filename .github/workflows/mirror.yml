# Copies new Senate roll-call vote files from senate.gov into this repo every 10 minutes.
# Public repo, so GitHub Actions minutes are free. Reads public files only; no secrets.
#
# Each run starts the next one about 10 minutes later (last step), because GitHub's own
# schedule never fired for this repo. The schedule stays as a backup that restarts the chain
# if it ever breaks. Pressing "Run workflow" by hand is safe: only one run goes at a time.
name: Mirror Senate votes
on:
  schedule:
    # Minutes 3, 13, 23...: GitHub runs schedules late or skips them at busy times like :00.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write # to start the next run
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash mirror.sh
      - name: Save what changed
        run: |
          git config user.name "senate-mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A legislative last-checked.txt
          # last-checked.txt alone doesn't need a commit, except after 30 quiet days, so GitHub
          # keeps the schedule running (it pauses schedules in repos with no commits for 60 days).
          if git diff --cached --quiet -- legislative && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 2592000 ]; then
            echo "No new votes."; exit 0
          fi
          git commit -qm "Senate votes as of $(cat last-checked.txt)"
          # Someone may have changed the repo while this run was copying; add our files on top.
          git pull -q --rebase origin main && git push
      - name: Start the next run in about 10 minutes
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          gh workflow run mirror.yml --ref main --repo "$GITHUB_REPOSITORY"
